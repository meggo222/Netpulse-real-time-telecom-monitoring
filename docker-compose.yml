# =============================================================================
# Real-Time Telecom Network Monitoring & Alerting System
# Phase 1: Infrastructure Foundation
# =============================================================================

networks:
  telecom-net:
    driver: bridge

volumes:
  zookeeper_data:
  kafka_data:
  postgres_app_data:
  postgres_airflow_data:
  grafana_data:
  spark_logs:

services:

  # ---------------------------------------------------------------------------
  # ZOOKEEPER — required by Kafka for broker/cluster coordination (KRaft not
  # used here on purpose: Confluent's Zookeeper-based setup is more widely
  # documented, which matters for a portfolio project meant to be readable).
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: telecom-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - telecom-net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # KAFKA BROKER — single-broker cluster (fine for local/portfolio use).
  # PLAINTEXT listener split into two: one for inter-container traffic
  # (kafka:29092) and one for host-machine access (localhost:9092) so you
  # can debug from VS Code / a local Python script outside Docker if needed.
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: telecom-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 48
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - telecom-net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # KAFKA UI — optional visual tool to inspect topics/messages/consumer
  # groups. Great for debugging and for demo recordings on the portfolio.
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: telecom-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: telecom-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - telecom-net

  # ---------------------------------------------------------------------------
  # POSTGRES (APPLICATION DATA) — stores raw events, processed events,
  # alerts, device info, and daily summaries. Kept separate from Airflow's
  # metadata DB by design (see architectural notes).
  # ---------------------------------------------------------------------------
  postgres_app:
    image: postgres:15
    container_name: telecom-postgres-app
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${APP_DB_USER}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
      POSTGRES_DB: ${APP_DB_NAME}
    volumes:
      - postgres_app_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    networks:
      - telecom-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER} -d ${APP_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # POSTGRES (AIRFLOW METADATA) — isolated from application data.
  # ---------------------------------------------------------------------------
  postgres_airflow:
    image: postgres:15
    container_name: telecom-postgres-airflow
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    networks:
      - telecom-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # SPARK MASTER / WORKER — Standalone mode (no YARN/K8s) for simplicity
  # on a local machine. Structured Streaming jobs get spark-submit'ed here
  # starting Phase 3.
  # ---------------------------------------------------------------------------
  spark-master:
    image: apache/spark:3.5.1
    container_name: telecom-spark-master
    restart: unless-stopped
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      APP_DB_HOST: postgres_app
      APP_DB_PORT: "5432"
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      APP_DB_NAME: ${APP_DB_NAME}
    ports:
      - "7077:7077"   # Spark master RPC
      - "8080:8080"   # Spark master Web UI
    volumes:
      - ./src/spark_jobs:/opt/spark-apps
      - spark_logs:/opt/spark/logs
    networks:
      - telecom-net

  spark-worker:
    image: apache/spark:3.5.1
    container_name: telecom-spark-worker
    restart: unless-stopped
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: 2
      APP_DB_HOST: postgres_app
      APP_DB_PORT: "5432"
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      APP_DB_NAME: ${APP_DB_NAME}
    ports:
      - "8081:8081"   # Spark worker Web UI
    volumes:
      - ./src/spark_jobs:/opt/spark-apps
      - spark_logs:/opt/spark/logs
    networks:
      - telecom-net

  # ---------------------------------------------------------------------------
  # AIRFLOW — LocalExecutor is enough for this project's scale (no need for
  # CeleryExecutor/Redis, which would add unnecessary complexity locally).
  # ---------------------------------------------------------------------------
  airflow-init:
    image: apache/airflow:2.9.1
    container_name: telecom-airflow-init
    depends_on:
      postgres_airflow:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres_airflow:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "telecom-monitoring-shared-secret-key-2026"
      _PIP_ADDITIONAL_REQUIREMENTS: "psycopg2-binary==2.9.9"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username ${AIRFLOW_ADMIN_USER} \
          --password ${AIRFLOW_ADMIN_PASSWORD} \
          --firstname Ahmed \
          --lastname Admin \
          --role Admin \
          --email admin@telecom-monitoring.local
    volumes:
      - ./dags:/opt/airflow/dags
    networks:
      - telecom-net

  airflow-webserver:
    image: apache/airflow:2.9.1
    container_name: telecom-airflow-webserver
    restart: unless-stopped
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres_airflow:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "telecom-monitoring-shared-secret-key-2026"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      _PIP_ADDITIONAL_REQUIREMENTS: "psycopg2-binary==2.9.9"
      APP_DB_HOST: postgres_app
      APP_DB_PORT: "5432"
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      APP_DB_NAME: ${APP_DB_NAME}
    ports:
      - "8090:8080"
    command: webserver
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./reports:/opt/airflow/reports
    networks:
      - telecom-net
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    image: apache/airflow:2.9.1
    container_name: telecom-airflow-scheduler
    restart: unless-stopped
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres_airflow:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "telecom-monitoring-shared-secret-key-2026"
      _PIP_ADDITIONAL_REQUIREMENTS: "psycopg2-binary==2.9.9"
      APP_DB_HOST: postgres_app
      APP_DB_PORT: "5432"
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      APP_DB_NAME: ${APP_DB_NAME}
    command: scheduler
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./reports:/opt/airflow/reports
    networks:
      - telecom-net

  # ---------------------------------------------------------------------------
  # GRAFANA — dashboards read directly from postgres_app.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # ADMINER — lightweight web UI for browsing/querying PostgreSQL, no local
  # install needed (unlike pgAdmin/DBeaver).
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: telecom-adminer
    restart: unless-stopped
    depends_on:
      - postgres_app
    ports:
      - "8082:8080"
    networks:
      - telecom-net

  grafana:
    image: grafana/grafana:11.0.0
    container_name: telecom-grafana
    restart: unless-stopped
    depends_on:
      - postgres_app
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      APP_DB_HOST: postgres_app
      APP_DB_PORT: "5432"
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      APP_DB_NAME: ${APP_DB_NAME}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - telecom-net
